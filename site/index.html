<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Axiom Design</title>
  <meta name="description" content="Axiom Design, LLC" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-30 -30 247 368'%3E%3Crect x='-30' y='-30' width='247' height='368' fill='white'/%3E%3Cpath d='M182.91,156.7L19.37,3.12C16.03-.02,11.14-.88,6.93.95,2.72,2.77,0,6.92,0,11.5v284.17c0,6.35,5.15,11.5,11.5,11.5s11.5-5.15,11.5-11.5V38.08l63.48,59.61-36.3,36.32c-4.49,4.49-4.49,11.77,0,16.26,2.25,2.24,5.19,3.37,8.13,3.37s5.89-1.12,8.13-3.37l36.81-36.83,62.71,58.89,1.21,1.13c4.63,4.35,11.91,4.12,16.26-.51,4.35-4.63,4.12-11.91-.51-16.26Z'/%3E%3C/svg%3E" />
  <style>
    :root { --ink: #000; --paper: #fff; --accent: rgb(50, 121, 168); }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2rem, 6vh, 3.75rem);
      padding: 2rem;
    }

    .logo { width: min(68vw, 640px); }
    .logo svg { display: block; width: 100%; height: auto; }

    .logo-glow {
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .logo.is-hovered .logo-glow {
      opacity: 1;
      transition-duration: 0.65s;
    }

    /* Each letter fades up from nothing, left to right, settling from blue to black.
       The color runs longer than the opacity so the blue is fully visible before it deepens. */
    .letter {
      fill: var(--ink);
      animation: fade-in 1s ease-out both, ink-in 1.6s ease-in-out both;
      animation-delay: var(--d);
    }

    @keyframes ink-in { from { fill: var(--accent); } to { fill: var(--ink); } }

    .contact {
      font-size: clamp(0.7rem, 1.5vw, 0.78rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      /* matches letter-spacing, so the rule overhangs evenly on both sides */
      padding-left: 0.18em;
      padding-bottom: 0.3em;
      /* grows the tap target to a comfortable size without shifting the rule */
      padding-top: 0.5rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.25);
      transition: border-color 0.35s ease;
      animation: fade-in 1s ease-out both;
      animation-delay: 0.65s;
    }

    .contact:hover,
    .contact:focus-visible { border-bottom-color: var(--ink); }

    .copyright {
      padding: 0 2rem 2rem;
      font-size: clamp(0.62rem, 1.2vw, 0.68rem);
      letter-spacing: 0.1em;
      color: rgba(0, 0, 0, 0.32);
      animation: fade-in 1s ease-out both;
      animation-delay: 0.82s;
    }

    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    /* Respect users who prefer no motion — show everything instantly */
    @media (prefers-reduced-motion: reduce) {
      .letter, .contact, .copyright { animation: none; opacity: 1; }
      .logo-glow { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">
      <svg viewBox="0 0 786.6 307.17" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Axiom Design">
        <defs>
          <radialGradient id="glow-head" cx="393.3" cy="153.6" r="175" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="var(--accent)" stop-opacity="0.2" />
            <stop offset="0.48" stop-color="var(--accent)" stop-opacity="0.34" />
            <stop offset="1" stop-color="var(--accent)" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="glow-trail" cx="393.3" cy="153.6" r="245" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="var(--accent)" stop-opacity="0.8" />
            <stop offset="0.58" stop-color="var(--accent)" stop-opacity="0.45" />
            <stop offset="1" stop-color="var(--accent)" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="glow-wake" cx="393.3" cy="153.6" r="330" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="var(--accent)" stop-opacity="0.6" />
            <stop offset="0.62" stop-color="var(--accent)" stop-opacity="0.3" />
            <stop offset="1" stop-color="var(--accent)" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="glow-afterglow" cx="393.3" cy="153.6" r="380" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="var(--accent)" stop-opacity="0.4" />
            <stop offset="0.68" stop-color="var(--accent)" stop-opacity="0.18" />
            <stop offset="1" stop-color="var(--accent)" stop-opacity="0" />
          </radialGradient>
          <mask id="logo-mask" x="0" y="0" width="786.6" height="307.17" maskUnits="userSpaceOnUse" style="mask-type: alpha">
            <use href="#logo-letters" fill="#fff" />
          </mask>
        </defs>

        <g id="logo-letters">
        <!-- A -->
        <path class="letter" style="--d:.04s" d="M182.91,156.7L19.37,3.12C16.03-.02,11.14-.88,6.93.95,2.72,2.77,0,6.92,0,11.5v284.17c0,6.35,5.15,11.5,11.5,11.5s11.5-5.15,11.5-11.5V38.08l63.48,59.61-36.3,36.32c-4.49,4.49-4.49,11.77,0,16.26,2.25,2.24,5.19,3.37,8.13,3.37s5.89-1.12,8.13-3.37l36.81-36.83,62.71,58.89,1.21,1.13c4.63,4.35,11.91,4.12,16.26-.51,4.35-4.63,4.12-11.91-.51-16.26Z" />

        <!-- X -->
        <path class="letter" style="--d:.13s" d="M293.31,86.28l66.64-66.64c4.49-4.49,4.49-11.77,0-16.26-4.49-4.49-11.77-4.49-16.26,0l-66.64,66.64L210.41,3.37c-4.49-4.49-11.77-4.49-16.26,0-4.49,4.49-4.49,11.77,0,16.26l66.64,66.64-66.64,66.64c-4.49,4.49-4.49,11.77,0,16.26,2.25,2.25,5.19,3.37,8.13,3.37s5.89-1.12,8.13-3.37l66.64-66.64,65.76,65.76c2.25,2.25,5.19,3.37,8.13,3.37s5.89-1.12,8.13-3.37c4.49-4.49,4.49-11.77,0-16.26l-65.76-65.76Z" />

        <!-- I -->
        <path class="letter" style="--d:.22s" d="M387.68,0c-6.35,0-11.5,5.15-11.5,11.5v149.55c0,6.35,5.15,11.5,11.5,11.5s11.5-5.15,11.5-11.5V11.5C399.18,5.15,394.03,0,387.68,0Z" />

        <!-- O -->
        <path class="letter" style="--d:.31s" d="M593.85,8.69C592.56,3.58,587.97,0,582.7,0h-143.42c-5.14,0-9.66,3.41-11.06,8.35-1.66,5.83-16.18,57.49-16.18,77.48s14.52,71.65,16.18,77.48c1.41,4.94,5.92,8.35,11.06,8.35h143.42c5.27,0,9.86-3.58,11.15-8.69,1.47-5.82,14.34-57.4,14.34-77.15s-12.88-71.33-14.34-77.15ZM448.03,148.67c-5.01-18.57-13-50.73-13-62.83s7.99-44.27,13-62.83h125.65c4.47,18.69,11.52,50.73,11.52,62.83s-7.05,44.14-11.52,62.83h-125.65Z" />

        <!-- M -->
        <path class="letter" style="--d:.40s" d="M779.62,4.42c-4.24-1.81-9.14-.92-12.47,2.27l-64.48,61.77-62.16-59.55c-3.33-3.19-8.23-4.08-12.47-2.27-4.24,1.81-6.99,5.97-6.99,10.58v146.07c0,6.35,5.15,11.5,11.5,11.5,3.33,0,6.32-1.42,8.42-3.68,1.91-2.05,3.08-4.79,3.08-7.82V44.17l50.66,48.53c4.45,4.26,11.46,4.26,15.91,0l52.98-50.76v253.73c0,6.35,5.15,11.5,11.5,11.5s11.5-5.15,11.5-11.5V15c0-4.61-2.75-8.77-6.99-10.58Z" />
        </g>

        <g class="logo-glow" mask="url(#logo-mask)">
          <rect width="786.6" height="307.17" fill="url(#glow-afterglow)" />
          <rect width="786.6" height="307.17" fill="url(#glow-wake)" />
          <rect width="786.6" height="307.17" fill="url(#glow-trail)" />
          <rect width="786.6" height="307.17" fill="url(#glow-head)" />
        </g>
      </svg>
    </div>

    <a class="contact" href="mailto:andy@axiomdesignpdx.com">Get in touch</a>
  </main>

  <footer class="copyright">&copy; Axiom Design, LLC</footer>

  <script>
    const logo = document.querySelector('.logo');
    const logoSvg = logo.querySelector('svg');
    const glowHead = logoSvg.querySelector('#glow-head');
    const glowTrail = logoSvg.querySelector('#glow-trail');
    const glowWake = logoSvg.querySelector('#glow-wake');
    const glowAfterglow = logoSvg.querySelector('#glow-afterglow');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const trail = {
      targetX: 393.3,
      targetY: 153.6,
      trailX: 393.3,
      trailY: 153.6,
      wakeX: 393.3,
      wakeY: 153.6,
      afterglowX: 393.3,
      afterglowY: 153.6,
      initialized: false,
      frame: null
    };

    function cursorPoint(event) {
      const matrix = logoSvg.getScreenCTM();
      if (!matrix) return null;

      return new DOMPoint(event.clientX, event.clientY)
        .matrixTransform(matrix.inverse());
    }

    function placeGradient(gradient, x, y) {
      gradient.setAttribute('cx', x.toFixed(2));
      gradient.setAttribute('cy', y.toFixed(2));
    }

    function drawTrail() {
      trail.trailX += (trail.targetX - trail.trailX) * 0.02;
      trail.trailY += (trail.targetY - trail.trailY) * 0.02;
      trail.wakeX += (trail.targetX - trail.wakeX) * 0.006;
      trail.wakeY += (trail.targetY - trail.wakeY) * 0.006;
      trail.afterglowX += (trail.targetX - trail.afterglowX) * 0.0015;
      trail.afterglowY += (trail.targetY - trail.afterglowY) * 0.0015;

      placeGradient(glowHead, trail.targetX, trail.targetY);
      placeGradient(glowTrail, trail.trailX, trail.trailY);
      placeGradient(glowWake, trail.wakeX, trail.wakeY);
      placeGradient(glowAfterglow, trail.afterglowX, trail.afterglowY);

      const trailDistance = Math.hypot(trail.targetX - trail.trailX, trail.targetY - trail.trailY);
      const wakeDistance = Math.hypot(trail.targetX - trail.wakeX, trail.targetY - trail.wakeY);
      const afterglowDistance = Math.hypot(trail.targetX - trail.afterglowX, trail.targetY - trail.afterglowY);

      if (Math.max(trailDistance, wakeDistance, afterglowDistance) > 0.1) {
        trail.frame = requestAnimationFrame(drawTrail);
      } else {
        trail.trailX = trail.wakeX = trail.targetX;
        trail.trailY = trail.wakeY = trail.targetY;
        trail.afterglowX = trail.targetX;
        trail.afterglowY = trail.targetY;
        trail.frame = null;
      }
    }

    function moveGlow(event) {
      const point = cursorPoint(event);
      if (!point) return;

      trail.targetX = point.x;
      trail.targetY = point.y;

      if (!trail.initialized || reducedMotion.matches) {
        trail.trailX = trail.wakeX = point.x;
        trail.trailY = trail.wakeY = point.y;
        trail.afterglowX = point.x;
        trail.afterglowY = point.y;
        trail.initialized = true;
      }

      if (trail.frame === null) trail.frame = requestAnimationFrame(drawTrail);
    }

    logo.addEventListener('pointerenter', (event) => {
      moveGlow(event);
      logo.classList.add('is-hovered');
    });
    logo.addEventListener('pointermove', moveGlow);
    logo.addEventListener('pointerleave', () => {
      logo.classList.remove('is-hovered');
    });
  </script>
</body>
</html>
